[project]
name = "local-llm"
version = "0.1.0"
description = "A local continuously learning LLM with RAG and online training"
requires-python = ">=3.11"

dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "bitsandbytes>=0.43.0",
    "datasets>=2.18.0",
    "trl>=0.8.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.7.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "accelerate>=0.28.0",
    "huggingface-hub>=0.23.0",
]

[project.optional-dependencies]
web = ["gradio>=4.0.0"]
dev = ["pytest", "black", "ruff"]

[project.scripts]
llm = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
